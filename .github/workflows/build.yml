name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repo
        uses: actions/checkout@v4

      - name: Checkout vapourkit repo (for filter generation)
        uses: actions/checkout@v4
        with:
          repository: Kim2091/vapourkit
          path: vapourkit-source
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate filter docs
        env:
          VAPOURKIT_REPO_PATH: ${{ github.workspace }}/vapourkit-source
        run: npm run gen:filters

      - name: Generate OG image
        run: npm run gen:og

      - name: Build site
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist/
